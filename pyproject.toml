[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "household-supply-planner"
version = "0.11.0"
description = "Deterministic household supply planning core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"household_supply.web" = ["assets/*.html", "assets/*.js", "assets/*.css"]
